version: '3.8'

services:
  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    container_name: homeassistant
    volumes:
      - ./data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-n8n_nextcloud}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - ai_net

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n_nextcloud}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-admin}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - N8N_HOST=${DOMAIN_NAME:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=${TIMEZONE:-Europe/Berlin}
      - N8N_SECURE_COOKIE=false
    entrypoint: ["tini", "--", "/bin/sh", "-c"]
    command: >
      "
        echo 'Warte auf Cloudflare Tunnel URL...'
        touch /tmp/tunnel/cloudflared.log
        while ! grep -q 'https://.*trycloudflare.com' /tmp/tunnel/cloudflared.log; do
          sleep 2
        done
        export WEBHOOK_URL=\$$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' /tmp/tunnel/cloudflared.log | head -n 1)
        echo \"Tunnel gefunden: \$$WEBHOOK_URL\"
        exec /docker-entrypoint.sh start
      "
    ports:
      - "5678:5678"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - tunnel_data:/tmp/tunnel
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_net
    depends_on:
      - postgres
      - cloudflared

  cloudflared:
    image: python:3.11-slim
    container_name: cloudflared
    restart: unless-stopped
    volumes:
      - tunnel_data:/tmp/tunnel
    command: >
      sh -c "
        apt-get update && apt-get install -y curl &&
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /cloudflared &&
        chmod +x /cloudflared &&
        echo 'Starte Cloudflare Tunnel...' &&
        /cloudflared tunnel --url http://n8n:5678 2>&1 | tee /tmp/tunnel/cloudflared.log
      "
    networks:
      - ai_net

  nextcloud:
    image: nextcloud
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-n8n_nextcloud}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    volumes:
      - ./data/nextcloud:/var/www/html
    networks:
      - ai_net
    depends_on:
      - postgres

  agent-harness:
    image: python:3.11-slim
    container_name: agent_harness
    restart: unless-stopped
    command: tail -f /dev/null
    volumes:
      - ./data/harness:/workspace
      - ./data/nextcloud:/nextcloud_shared
    environment:
      - NEXTCLOUD_URL=${NEXTCLOUD_URL:-http://nextcloud:80}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_net

  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: whisper
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids:
                - nvidia.com/gpu=all
              capabilities: [gpu]
    volumes:
      - ./data/whisper:/root/.cache/huggingface
    networks:
      - ai_net

networks:
  ai_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ainet

volumes:
  tunnel_data:
